<div class="expSectionBody flex justify-center pb-[50px]" #expSection id="expSection">
    <div class="expSection w-[80%]">
        <div class="expSect">
            <h2 class="expHeader">MY CAREER PROGRESSION</h2>
            <h1 class="expH1">Experience</h1>
        </div>
        <div class="expCardsSection">
            @for(exp of experience; track exp.id){
                <div class="expCards">
                    <img [src]="exp.imgUrl" [alt]="exp.company" class="expIcon">
                    <h2 class="expName">{{exp.company}}</h2>
                    <h3 class="expTitle">{{exp.role}}</h3>
                    <p class="expDuration">{{exp.startDate}} - {{exp.endDate}}</p>
                </div>
            }

        </div>
        
    </div>
</div>
