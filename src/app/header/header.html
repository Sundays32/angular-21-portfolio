<div class="headerSection flex justify-between pt-[5px]">
    <div class="logo flex h-[50px] items-center p-[12px]">
        <img src="assets/Logo.png" alt="SR" class="h-[70px]">
        <h1 class="font-bold nameText text-[25px] pb-[5px]">Sandesh Rao</h1>
    </div>
    @if(!mobileView){
        <div class="navigator content-center">
            <ul class="flex gap-[10px]">
                <li (click)="scrollTo('homeSection')">Home</li>
                <li (click)="scrollTo('aboutSection')">About</li>
                <li (click)="scrollTo('technologySection')">Skills</li>
                <li (click)="scrollTo('expSection')">Experience</li>
                <li (click)="scrollTo('educationSection')">Education</li>
            </ul>
        </div>
        <div class="portfolioActionBtns flex pr-[12px] items-center gap-[10px]">
            <!-- <a href="#">
                <mat-icon class="darkModeBtn">dark_mode</mat-icon>
            </a> -->
            <button matFab extended class="downloadCVBtn" (click)="downloadCV()">
                <mat-icon>download</mat-icon>
                Download CV
            </button>
        </div>
    }
    @else{
        <div class="menuBtn pr-[12px] pt-[12px]">
            <a>
                <mat-icon class="closeMobileMenu" (click)="openMobileMenu()">{{!openMobileMenuSidebar? 'menu' : 'close'}}</mat-icon>
            </a>
            @if(openMobileMenuSidebar){
            <div class="mobileNavMenu">
                <div class="mobileNavigator">
                    <div class="portfolioActionBtns flex pr-[12px] items-center gap-[10px] justify-end">
                                <!-- <a href="#">
                                    <mat-icon class="darkModeBtn">dark_mode</mat-icon>
                                </a> -->
                                <button matFab extended class="downloadCVBtn" (click)="downloadCV()">
                                    <mat-icon>download</mat-icon>
                                    Download CV
                                </button>
                            </div>
                    <ul class="">
                        <li (click)="scrollTo('homeSection')">Home</li>
                        <li (click)="scrollTo('aboutSection')">About</li>
                        <li (click)="scrollTo('technologySection')">Skills</li>
                        <li (click)="scrollTo('expSection')">Experience</li>
                        <li (click)="scrollTo('educationSection')">Education</li>
                    </ul>
                </div>
            </div>
                            
            }
        </div>
    }
</div>
